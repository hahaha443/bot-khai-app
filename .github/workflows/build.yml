name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Huỷ các run cũ hơn đang chạy dở trên cùng nhánh khi có push mới — tránh
# tình trạng nhìn vào Actions thấy nhiều run xanh cũ nằm lẫn với run mới,
# dễ tưởng nhầm là "chưa build" trong khi thật ra bản mới nhất đã build xong.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      # Đặt tên artifact kèm số run + commit ngắn để phân biệt rõ ràng
      # đâu là bản build mới nhất khi nhìn danh sách Artifacts.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-run${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # In thẳng đường link tải APK của ĐÚNG lần build này vào tab Summary
      # của run (không phải trang /actions chung) — bấm vào run là thấy
      # ngay link, khỏi phải đoán run nào mới nhất.
      - name: Print direct download info
        run: |
          echo "### ✅ Build #${{ github.run_number }} xong" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 Cuộn xuống mục **Artifacts** ở cuối trang run này để tải APK." >> $GITHUB_STEP_SUMMARY
